"], "S": {"#tz": {"opacity": 0}, "#kDuct": {"opacity": 0}, "#caCel": {"opacity": 0}, "#setaDuct": {"opacity": 0}, "#ncc": {"brilho": 1}, "#chCl_b": {"x": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCa_b": {"x": 0}, "#chCa": {"brilho": 0}, "#chCa_a": {"x": 0}}}, {"t": "Bomba leva Na⁺ ao sangue e Cl⁻ sai por canal", "r": "Saída basolateral", "x": "Na face basolateral, a Na⁺/K⁺-ATPase joga o Na⁺ no sangue e traz K⁺ de volta; o Cl⁻ sai por um canal de cloreto. O NaCl reabsorvido chega ao sangue.", "tags": ["Aula 01:26:43"], "foco": [700, 260, 120, 125], "on": ["naOut", "kIn", "clOut"], "S": {"#tz": {"opacity": 0}, "#kDuct": {"opacity": 0}, "#caCel": {"opacity": 0}, "#setaDuct": {"opacity": 0}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 1}, "#chCl_a": {"x": -7}, "#chCl_b": {"x": 7}, "#chCa_b": {"x": 0}, "#chCa": {"brilho": 0}, "#chCa_a": {"x": 0}}}, {"t": "Tiazídico bloqueia o simporte Na⁺/Cl⁻", "r": "Tiazídico bloqueia", "x": "Hidroclorotiazida, clortalidona e indapamida bloqueiam o simporte Na⁺/Cl⁻ do TCD. Não é o Na⁺/K⁺/2Cl⁻ da alça nem o ducto coletor: a prova troca o segmento ou o transportador.", "tags": ["Aula 01:26:43", "Slide 25"], "foco": [300, 200, 95, 62], "nota": [200, 240, "simporte bloqueado"], "m": [55, 50], "ml": ["↑", "basal"], "S": {"#tz": {"opacity": 1}, "#kDuct": {"opacity": 0}, "#caCel": {"opacity": 0}, "#setaDuct": {"opacity": 0}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCl_b": {"x": 0}, "#chCa_b": {"x": 0}, "#chCa": {"brilho": 0}, "#chCa_a": {"x": 0}}}, {"t": "NaCl fica no lúmen e segue ao ducto coletor", "r": "NaCl segue", "x": "Sem o simporte, o NaCl fica no lúmen e desce para o ducto coletor. Sai mais sódio na urina, e a água acompanha: é a diurese do tiazídico.", "tags": ["Aula 01:26:56"], "foco": [195, 320, 115, 175], "on": ["lumDown"], "m": [75, 50], "ml": ["↑", "basal"], "S": {"#tz": {"opacity": 1}, "#kDuct": {"opacity": 0}, "#caCel": {"opacity": 0}, "#setaDuct": {"opacity": 1}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCl_b": {"x": 0}, "#chCa_b": {"x": 0}, "#chCa": {"brilho": 0}, "#chCa_a": {"x": 0}}}, {"t": "No ducto coletor, Na⁺ volta e K⁺ é perdido", "r": "K⁺ perdido", "x": "No ducto coletor, parte desse Na⁺ extra é reabsorvida e, em troca, o K⁺ vai embora na urina. Por isso o tiazídico também é espoliador de potássio; o magnésio também se perde.", "tags": ["Aula 01:26:56", "Aula 01:27:19"], "foco": [195, 508, 160, 52], "on": ["kSai"], "S": {"#tz": {"opacity": 1}, "#kDuct": {"opacity": 1}, "#caCel": {"opacity": 0}, "#setaDuct": {"opacity": 1}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCl_b": {"x": 0}, "#chCa_b": {"x": 0}, "#chCa": {"brilho": 0}, "#chCa_a": {"x": 0}}}, {"t": "Cálcio: reabsorção aumenta", "r": "Poupa Ca²⁺", "x": "O cálcio faz o contrário da alça: a reabsorção aumenta e sai menos Ca²⁺ na urina. Por isso trata cálculo de cálcio e serve na osteoporose da menopausa. O mecanismo exato não está esclarecido (PTH? calcitriol?).", "tags": ["Aula 01:28:19"], "foco": [460, 400, 280, 62], "on": ["caIn"], "nota": [470, 450, "menos Ca²⁺ na urina"], "m": [75, 18], "ml": ["↑", "↓ poupa"], "S": {"#tz": {"opacity": 1}, "#kDuct": {"opacity": 1}, "#caCel": {"opacity": 1}, "#setaDuct": {"opacity": 1}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCl_b": {"x": 0}, "#chCa_a": {"x": -7}, "#chCa_b": {"x": 7}, "#chCa": {"brilho": 1}}}, {"t": "Depois da mácula densa: renina quase não muda", "r": "Renina estável", "x": "Como age depois da mácula densa, o tiazídico mexe muito pouco no fluxo sanguíneo renal e na renina. É a diferença para a furosemida, que bloqueia o transportador da própria mácula densa.", "tags": ["Aula 01:29:09"], "foco": [118, 125, 80, 48], "hot": ["MD"], "S": {"#tz": {"opacity": 1}, "#kDuct": {"opacity": 1}, "#caCel": {"opacity": 1}, "#setaDuct": {"opacity": 1}, "#ncc": {"brilho": 0}, "#atp": {"brilho": 0}, "#chCl_a": {"x": 0}, "#chCl_b": {"x": 0}, "#chCa_a": {"x": -7}, "#chCa_b": {"x": 7}, "#chCa": {"brilho": 0}}}]};
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const NERVES=D.vias, FLOWS=D.fluxos, NUC=D.nucleos, STEPS=D.etapas;
const gN=$('nerves');
for(const k in NERVES){const n=NERVES[k];n.c=n.cor||n.c||'var(--aff)';const g=el('g',{class:'nerve',id:'n_'+k},gN);
  el('path',{class:'case',d:n.d},g);const ax=el('path',{class:'ax',d:n.d,stroke:n.c},g);n.ax=ax;n.g=g;
  if(n.inib){const L=ax.getTotalLength(),p=ax.getPointAtLength(L),q=ax.getPointAtLength(L-6);const a=Math.atan2(p.y-q.y,p.x-q.x)+Math.PI/2;
    el('line',{x1:p.x+11*Math.cos(a),y1:p.y+11*Math.sin(a),x2:p.x-11*Math.cos(a),y2:p.y-11*Math.sin(a),stroke:n.c,'stroke-width':5,'stroke-linecap':'round'},g);}}
const gF=$('flows');
for(const k in FLOWS){const f=FLOWS[k];f.ax=el('path',{d:f.d,fill:'none',stroke:'none'},gF);}
const gK=$('nuclei');
for(const k in NUC){const [x,y,r,t,c]=NUC[k];const g=el('g',{id:'k_'+k},gK);
  el('circle',{cx:x,cy:y,r:r+5,fill:c,opacity:.16},g);el('circle',{cx:x,cy:y,r,fill:'url(#gNode)',stroke:c,'stroke-width':2.5},g);
  const parts=t.split(' ');if(parts.length>1){el('text',{x,y:y-2,'text-anchor':'middle',class:'nuc-t'},g).textContent=parts[0];el('text',{x,y:y+13,'text-anchor':'middle',class:'nuc-t'},g).textContent=parts.slice(1).join(' ');}
  else el('text',{x,y:y+4.5,'text-anchor':'middle',class:'nuc-t'},g).textContent=t;}
const gL=$('labels');
function label(x,y,t,s,lx,ly){const g=el('g',{},gL);
  if(lx!=null)el('path',{d:`M${x},${y} L${lx},${ly}`,stroke:'var(--label-line)','stroke-width':1.5,fill:'none'},g);
  const bg=el('rect',{rx:8,fill:'var(--label-bg)',stroke:'var(--label-line)','stroke-width':1},g);
  const t1=el('text',{x:x+10,y:y+(s?17:19),class:'lab-t'},g);t1.textContent=t;
  let w=t1.getComputedTextLength();
  if(s){const t2=el('text',{x:x+10,y:y+32,class:'lab-s'},g);t2.textContent=s;w=Math.max(w,t2.getComputedTextLength());}
  bg.setAttribute('x',x);bg.setAttribute('y',y);bg.setAttribute('width',w+20);bg.setAttribute('height',s?40:28);}
D.rotulos.forEach(a=>label(...a));
const gP=$('pulses');const pulses=[];
function setPulses(on,speed){pulses.forEach(p=>p.el.remove());pulses.length=0;if(reduce)return;
  on.forEach(k=>{
    if(NERVES[k]){const n=NERVES[k];const L=n.ax.getTotalLength();const cnt=Math.max(2,Math.round(L/110));
      for(let i=0;i<cnt;i++){const c=el('circle',{r:5.2,fill:'#FFFFFF',stroke:n.c,'stroke-width':3,filter:'url(#glow)'},gP);pulses.push({el:c,ax:n.ax,L,off:i/cnt,v:speed*140/L});}}
    else if(FLOWS[k]){const f=FLOWS[k];const L=f.ax.getTotalLength();const cnt=f.n||3;
      for(let i=0;i<cnt;i++){const g=el('g',{},gP);el('circle',{r:f.r||7,fill:f.cor||'#2F80C8',stroke:'#fff','stroke-width':1.3},g);
        if(f.rotulo&&(f.r||7)>=8){const t=el('text',{y:3,'text-anchor':'middle',class:'ion-t'},g);t.textContent=f.rotulo;}
        pulses.push({el:g,ax:f.ax,L,off:i/cnt,v:(f.v||speed)*90/L,grp:true});}}});}
gsap.ticker.add((t)=>{for(const p of pulses){const f=(t*p.v+p.off)%1;const pt=p.ax.getPointAtLength(f*p.L);
  if(p.grp)p.el.setAttribute('transform',`translate(${pt.x} ${pt.y})`);else{p.el.setAttribute('cx',pt.x);p.el.setAttribute('cy',pt.y);}
  p.el.setAttribute('opacity',f<.08?f/.08:f>.92?(1-f)/.08:1);}});
const gM=$('meters');
D.medidores.forEach((m,i)=>{const d=document.createElement('div');d.className='meter';d.setAttribute('aria-label',m.nome+' ('+(m.sub||'')+')');
  const c=m.cor||['#A9CDF0','var(--para)'];
  d.innerHTML=`<div class="bar"><div class="fill" id="fill${i}" style="background:linear-gradient(to top,${c[0]},${c[1]})"></div></div><div><strong>${m.nome}</strong><small id="ml${i}"></small><small>${m.sub||''}</small></div>`;gM.appendChild(d);});
const loops={};
function applyState(S,d){
  for(const sel in S){const p=S[sel];const v={duration:p.dur!=null&&d?p.dur:d,ease:p.ease==='elastic'?'elastic.out(1,.6)':(p.ease||'power2.inOut')};let anim=false;
    for(const k of ['opacity','x','y','scale','rotate']){if(p[k]!=null){v[k]=Array.isArray(p[k])?(i=>p[k][i%p[k].length]):p[k];anim=true}}
    if(p.origem)v.svgOrigin=p.origem;
    if(p.attr){v.attr=Object.assign({},p.attr);anim=true}
    if(p.fill!=null){v.attr=Object.assign(v.attr||{},{fill:p.fill});anim=true}
    if(p.stroke!=null){v.attr=Object.assign(v.attr||{},{stroke:p.stroke});anim=true}
    if(p.stagger&&d)v.stagger=p.stagger;
    const alvo=sel.includes(' ')?sel:document.querySelector(sel);if(!alvo)continue;
    if(anim)gsap.to(sel.includes(' ')?sel:alvo,v);
    if(p.brilho!=null)gsap.set(alvo,{filter:p.brilho?'url(#glow)':'none'});
    if(p.pulsar!=null){if(loops[sel]){loops[sel].kill();delete loops[sel];gsap.set(alvo,{scale:p.scale||1})}
      if(p.pulsar&&!reduce){loops[sel]=gsap.to(alvo,{scale:1.07,svgOrigin:p.origem,duration:p.pulsar/2,yoyo:true,repeat:-1,ease:'sine.inOut'})}}}}
let cur=0,auto=false;
const rail=$('rail');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="n">${i+1}</span>${s.r||s.t}`;b.addEventListener('click',()=>{stopAuto();go(i)});rail.appendChild(b)});
function setNote(n,instant){const g=$('note');gsap.killTweensOf(g);if(!n){gsap.to(g,{opacity:0,duration:instant?0:.2});return}
  const tx=$('noteTx');tx.textContent=n[2];tx.setAttribute('x',n[0]+12);tx.setAttribute('y',n[1]+20);
  const w=tx.getComputedTextLength()+24,x=n[0],y=n[1],h=30;
  $('noteBg').setAttribute('d',`M${x+8},${y} h${w-16} a8,8 0 0 1 8,8 v${h-16} a8,8 0 0 1 -8,8 h${-(w-16)/2+7} l-7,8 l-7,-8 h${-(w-16)/2+7} a8,8 0 0 1 -8,-8 v${-(h-16)} a8,8 0 0 1 8,-8 z`);
  if(instant||reduce){gsap.set(g,{opacity:1,y:0});return}gsap.fromTo(g,{opacity:0,y:6},{opacity:1,y:0,duration:.4,delay:.35});}
function tagsHtml(tags){return (tags||[]).map(t=>{const a=Array.isArray(t)?t:[t,0];const ext=a[1]&&a[1]!==0;return `<span class="tag${ext?' ext':''}">${ext?'Complemento externo · ':''}${a[0]}</span>`}).join('')}
function render(){const s=STEPS[cur];
  $('eyebrow').textContent=`Etapa ${cur+1} de ${STEPS.length}`;$('ttl').textContent=s.t;$('txt').textContent=s.x;
  $('tags').innerHTML=tagsHtml(s.tags);
  D.medidores.forEach((m,i)=>{$('fill'+i).style.height=(s.m?s.m[i]:50)+'%';$('ml'+i).textContent=s.ml?s.ml[i]:'';});
  [...rail.children].forEach((b,i)=>{if(i===cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  $('prev').disabled=cur===0;$('next').disabled=cur===STEPS.length-1;}
function apply(s,instant){const d=instant||reduce?0:.9;const on=s.on||[];
  for(const k in NERVES)NERVES[k].g.classList.toggle('on',on.includes(k));
  const f=s.foco||[500,280,120,90];
  gsap.to('#focus',{opacity:1,duration:d});
  gsap.to('#fHalo',{attr:{cx:f[0],cy:f[1],rx:f[2]+22,ry:f[3]+22},duration:d,ease:'power2.inOut'});
  gsap.to('#fRing',{attr:{cx:f[0],cy:f[1],rx:f[2],ry:f[3]},duration:d,ease:'power2.inOut'});
  for(const k in NUC){const h=(s.hot||[]).includes(k);gsap.set('#k_'+k,{filter:h?'url(#glow)':'none'});gsap.to('#k_'+k,{scale:h?1.1:1,svgOrigin:`${NUC[k][0]} ${NUC[k][1]}`,duration:d*.6});}
  setPulses(on,s.sp||1);setNote(s.nota,instant);applyState(s.S||{},d);}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();
  if(!reduce&&cur>0)apply(STEPS[cur-1],true);
  requestAnimationFrame(()=>apply(STEPS[cur],false));
  if(auto){clearTimeout(go.t);go.t=setTimeout(()=>{if(!auto)return;if(cur<STEPS.length-1)go(cur+1);else stopAuto()},4800)}}
function stopAuto(){auto=false;clearTimeout(go.t);$('auto').textContent='▶ Tudo seguido'}
$('next').addEventListener('click',()=>{stopAuto();go(cur+1)});
$('prev').addEventListener('click',()=>{stopAuto();go(cur-1)});
$('replay').addEventListener('click',()=>go(cur));
$('auto').addEventListener('click',()=>{auto=!auto;$('auto').textContent=auto?'❚❚ Pausar':'▶ Tudo seguido';if(auto)go(cur===STEPS.length-1?0:cur);else stopAuto()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stopAuto();go(cur+1)}if(e.key==='ArrowLeft'){stopAuto();go(cur-1)}});
window.__anim={go,n:STEPS.length};
render();apply(STEPS[0],true);
})();
</script>
